<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线工具</title>
<style>
  :root {
    --primary: #2d8cf0;
    --primary-dark: #1c73c9;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e4e7ed;
    --text: #303133;
    --text-light: #909399;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 20px;
  }
  .container { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--text-light); font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .tool-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: all .15s;
    display: block;
  }
  .tool-card:hover { border-color: var(--primary); box-shadow: 0 4px 14px rgba(45,140,240,.12); transform: translateY(-2px); }
  .tool-card .icon { font-size: 26px; margin-bottom: 10px; }
  .tool-card .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .tool-card .desc { font-size: 12px; color: var(--text-light); }
  footer { text-align: center; color: var(--text-light); font-size: 12px; margin-top: 36px; }
</style>
</head>
<body>
<div class="container">
  <h1>在线工具</h1>
  <div class="subtitle">开发类实用小工具合集</div>

  <div class="grid">
    <a class="tool-card" href="timestamp.html">
      <div class="icon">🕒</div>
      <div class="name">时间戳转换</div>
      <div class="desc">Unix 时间戳与日期时间互转，支持多时区</div>
    </a>
    <a class="tool-card" href="hex.html">
      <div class="icon">🔡</div>
      <div class="name">Hex 与文本互转</div>
      <div class="desc">十六进制与文本字符串互相转换</div>
    </a>
    <a class="tool-card" href="password.html">
      <div class="icon">🔐</div>
      <div class="name">账号密码管理器</div>
      <div class="desc">明文密码与 TOTP 验证码，支持 JSON / 二维码导入导出（可加密）与 otpauth 链接单条导入</div>
    </a>
  </div>

  <footer>© 2026 在线工具</footer>
</div>
</body>
</html>
